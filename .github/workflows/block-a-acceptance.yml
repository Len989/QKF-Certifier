name: Block A acceptance comparison (archived PR32)
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  acceptance:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.12']
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: 370d235885528533b9e1b43c860bd0b304d3a849
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: ${{ matrix.python-version }}
      - name: Record exact harness tree and export the two immutable engines
        run: |
          mkdir -p reproduction/acceptance/engines/{v3,pr31}
          git rev-parse HEAD > reproduction/acceptance/revision.txt
          git rev-parse HEAD^{tree} > reproduction/acceptance/tree.txt
          git archive HEAD | gzip -n > reproduction/acceptance/source.tar.gz
          git archive c8c7b4eeaf848d31c8c324a4316ffec8aac81cda | tar -x -C reproduction/acceptance/engines/v3
          git archive eb2e68023e272c51710a25cdfe0a0ff8dd5642ac | tar -x -C reproduction/acceptance/engines/pr31
          python -m research.acceptance.preserve > reproduction/acceptance/preflight.json
          python -m research.acceptance.run --help > reproduction/acceptance/usage.txt
      - name: Constructed harness tests and all selected current-tree regressions
        run: |
          set -o pipefail
          python -m unittest research.acceptance.test_acceptance -v 2>&1 | tee reproduction/acceptance/tests-normal.log
          python -O -m unittest research.acceptance.test_acceptance -v 2>&1 | tee reproduction/acceptance/tests-optimized.log
          suites='research.signed_targets.test_targets research.signed_runtime.test_runtime research.signed_observations.test_observations research.signed_bridge.test_bridge research.inference.test_inference_v3 research.inference.test_inference_v2 research.inference.test_inference research.signed_predicates.test_signed_predicates research.wordexpr.test_predicates research.unified.test_unified research.observations.tests.test_inference research.observations.tests.test_factor'
          python -m unittest $suites -v 2>&1 | tee reproduction/acceptance/regressions-normal.log
          python -O -m unittest $suites -v 2>&1 | tee reproduction/acceptance/regressions-optimized.log
      - name: Acquire only the retained development bytes; no new holdout or Java run
        run: |
          python -m research.external.frozen_v2.download_sources reproduction/acceptance/input
      - name: All registered comparative attempts and guarded proof replays
        run: |
          python -m research.acceptance.run run reproduction/acceptance/experiment --old reproduction/acceptance/engines/v3 --new reproduction/acceptance/engines/pr31 --inputs reproduction/acceptance/input > reproduction/acceptance/result.json
          python -O -m research.acceptance.run audit reproduction/acceptance/experiment > reproduction/acceptance/audit.json
          python -m research.acceptance.report reproduction/acceptance/experiment reproduction/acceptance/ANALYSIS.json
          python - <<'PY'
          import hashlib, json
          from pathlib import Path
          actual=json.loads(Path('reproduction/acceptance/experiment/SUMMARY.json').read_text())
          expected=json.loads(Path('research/acceptance/EXPECTED.json').read_text())
          digest=hashlib.sha256(json.dumps(actual,sort_keys=True,separators=(',',':'),allow_nan=False).encode()).hexdigest()
          if digest!=expected['summary_sha256']:
              raise RuntimeError('deterministic acceptance result differs; inspect retained attempts')
          PY
      - name: Recheck preserved source bytes and modes
        run: |
          python -m research.acceptance.preserve > reproduction/acceptance/postflight.json
          cmp reproduction/acceptance/preflight.json reproduction/acceptance/postflight.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: block-a-acceptance-py${{ matrix.python-version }}
          path: reproduction/acceptance/
          retention-days: 30
