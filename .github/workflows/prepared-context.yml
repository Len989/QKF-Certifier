name: Prepared context PR48 comparisons
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  measurements:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        python-version: ['3.10', '3.12']
        suite: ['single', 'mask', 'parity', 'repeat', 'each']
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      COST_SUITE: ${{ matrix.suite }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: ${{ matrix.python-version }}
      - name: Record measured source and accepted PR47 preservation
        run: |
          mkdir -p reproduction/prepared
          git rev-parse HEAD > reproduction/prepared/revision.txt
          git rev-parse HEAD^{tree} > reproduction/prepared/tree.txt
          git archive HEAD | gzip -n > reproduction/prepared/source.tar.gz
          python --version > reproduction/prepared/python.txt
          python -m research.prepared_context.preserve > reproduction/prepared/preflight.json
      - name: Registered PR47 lifecycle protocol and independent replays
        run: |
          set -o pipefail
          python -m research.prepared_context.experiment reproduction/prepared/comparison --shard "$COST_SUITE" 2>&1 | tee reproduction/prepared/progress.log
          python -m research.prepared_context.replay reproduction/prepared/comparison > reproduction/prepared/replay-normal.json
          python -O -m research.prepared_context.replay reproduction/prepared/comparison > reproduction/prepared/replay-optimized.json
          python -m research.prepared_context.preserve > reproduction/prepared/postflight.json
          cmp reproduction/prepared/preflight.json reproduction/prepared/postflight.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: prepared-${{ matrix.suite }}-py${{ matrix.python-version }}
          path: reproduction/prepared/
          retention-days: 30
          if-no-files-found: error
