name: Signed observation closure (archived PR29)
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  observations:
    name: Archived PR29 observations (${{ matrix.python-version }})
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.12']
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: 012f680989628dbb0a25d7782860a7a843d06c8e
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: ${{ matrix.python-version }}
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '17'
      - name: Record exact current source tree and accepted-file preservation
        run: |
          mkdir -p reproduction/signed-observations
          git rev-parse HEAD > reproduction/signed-observations/revision.txt
          git rev-parse HEAD^{tree} > reproduction/signed-observations/tree.txt
          git archive HEAD | gzip -n > reproduction/signed-observations/source.tar.gz
          python --version > reproduction/signed-observations/python.txt
          java -version 2> reproduction/signed-observations/java.txt
          cat > reproduction/signed-observations/check-preservation.py <<'PY'
          import hashlib, json, subprocess
          from pathlib import Path
          base = 'fa199bfb325b4298e904a190b9bad6f63970ae70'
          tree = '88fdfbaa5ca333b1565bc52145ea9064a7c8f481'
          harness = '.github/workflows/signed-source-bridge.yml'
          entries = subprocess.check_output(['git','ls-tree','-rz',tree]).split(b'\0')
          paths, inventory = set(), {}
          for entry in filter(None, entries):
              meta, name = entry.split(b'\t', 1)
              mode, kind, expected = meta.decode().split()
              name = name.decode(); paths.add(name)
              if name == harness:
                  continue
              path = Path(name); raw = path.read_bytes()
              actual = hashlib.sha1(b'blob '+str(len(raw)).encode()+b'\0'+raw).hexdigest()
              actual_mode = '100755' if path.stat().st_mode & 0o111 else '100644'
              if path.is_symlink() or kind != 'blob' or expected != actual or actual_mode != mode:
                  raise RuntimeError('accepted file changed: '+name)
              inventory[name] = hashlib.sha256(raw).hexdigest()
          tracked = set(subprocess.check_output(['git','ls-files','-z']).decode().split('\0'))-{''}
          added = {'research/signed_observations/'+n for n in (
              '__init__.py','checker.py','producer.py','explain.py','cli.py',
              'experiment.py','test_observations.py','README_RU.md')}
          added.add('.github/workflows/signed-observation-closure.yml')
          if tracked-paths != added or not paths <= tracked:
              raise RuntimeError('unexpected added/deleted path')
          print(json.dumps({'base':base,'base_tree':tree,'preserved_files':len(inventory),
                            'allowed_live_harness_change':harness,'new_files':sorted(added),
                            'inventory_sha256':hashlib.sha256(json.dumps(inventory,sort_keys=True).encode()).hexdigest()},sort_keys=True))
          PY
          python reproduction/signed-observations/check-preservation.py > reproduction/signed-observations/preflight.json
      - name: New closure tests and retained current-tree regressions
        run: |
          set -o pipefail
          python -m unittest research.signed_observations.test_observations -v 2>&1 | tee reproduction/signed-observations/tests-normal.log
          python -O -m unittest research.signed_observations.test_observations -v 2>&1 | tee reproduction/signed-observations/tests-optimized.log
          suites='research.signed_bridge.test_bridge research.inference.test_inference_v3 research.inference.test_inference_v2 research.inference.test_inference research.signed_predicates.test_signed_predicates research.wordexpr.test_predicates research.unified.test_unified research.observations.tests.test_inference research.observations.tests.test_factor'
          python -m unittest $suites -v 2>&1 | tee reproduction/signed-observations/regressions-normal.log
          python -O -m unittest $suites -v 2>&1 | tee reproduction/signed-observations/regressions-optimized.log
      - name: Retained development sources and constructed delayed observations
        run: |
          python -m research.external.frozen_v2.download_sources reproduction/signed-observations/input
          python -m research.signed_observations.experiment reproduction/signed-observations/input reproduction/signed-observations/fresh > reproduction/signed-observations/experiment.json
      - name: Fresh guarded replay without producers, native execution or SMT
        run: |
          python -O - <<'PY'
          import builtins, json
          original = builtins.__import__
          def guarded(name, *args, **kwargs):
              if 'producer' in name or name.split('.')[0] in {'subprocess','z3','cvc5','pysmt'}:
                  raise RuntimeError('forbidden replay import: '+name)
              return original(name, *args, **kwargs)
          builtins.__import__ = guarded
          from research.signed_observations.experiment import run
          result=run('reproduction/signed-observations/input','reproduction/signed-observations/fresh',replay=True)
          if result['counts'] != {'source_observation_verified':8} or result['native_inputs'] != 209389 or result['target_checked']:
              raise RuntimeError('development scope changed')
          print(json.dumps(result,sort_keys=True))
          PY
      - name: CLI example, explanation and postflight identity
        run: |
          python -m research.signed_observations.cli infer research/inference/examples/SignedPower.java --class SignedPower --method isPowerOfTwo --word-type long --certificate reproduction/signed-observations/example.json
          python -O -m research.signed_observations.cli check research/inference/examples/SignedPower.java --class SignedPower --method isPowerOfTwo --word-type long --certificate reproduction/signed-observations/example.json
          python -O -m research.signed_observations.cli explain research/inference/examples/SignedPower.java --class SignedPower --method isPowerOfTwo --word-type long --certificate reproduction/signed-observations/example.json > reproduction/signed-observations/explanation.json
          python reproduction/signed-observations/check-preservation.py > reproduction/signed-observations/postflight.json
          cmp reproduction/signed-observations/preflight.json reproduction/signed-observations/postflight.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: signed-observation-closure-py${{ matrix.python-version }}
          path: reproduction/signed-observations/
          retention-days: 30
