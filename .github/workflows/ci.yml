name: Test and build
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python: ['3.10', '3.11', '3.12', '3.13', '3.14']
        include:
          - os: windows-latest
            python: '3.12'
          - os: macos-latest
            python: '3.12'
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -e '.[dev]'
      - run: python -m pytest
      - run: qkf batch examples/batch.json --json
  distribution:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e '.[dev]'
      - run: python -m ruff check .
      - run: python -m ruff format --check .
      - run: python -m build
      - name: Install and check wheel outside checkout
        run: |
          python -m venv /tmp/qkf-wheel-test
          /tmp/qkf-wheel-test/bin/python -m pip install --no-deps dist/*.whl
          cd /tmp
          /tmp/qkf-wheel-test/bin/qkf verify "$GITHUB_WORKSPACE/examples/ntmy/xor.mlir" --target xor --helper "meet=$GITHUB_WORKSPACE/examples/ntmy/meet.mlir" --json
      - uses: actions/upload-artifact@v4
        with:
          name: distributions
          path: dist/
