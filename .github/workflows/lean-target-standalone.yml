name: Lean target standalone
on:
  push:
    branches: [research/lean-target-validation-v1]
  pull_request:
    paths:
      - 'research/lean_targets/**'
      - '.github/workflows/lean-target-standalone.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  new-lean-target:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build the new exported target project (not the historical Lean pilot)
        uses: leanprover/lean-action@50fcf42d2e460296f1a34b402e990d1b24f8b596
        with:
          lake-package-directory: research/lean_targets
          use-github-cache: false
      - name: Record compiler and theorem axiom dependencies
        working-directory: research/lean_targets
        run: |
          mkdir -p ../../reproduction/lean_target_standalone
          lean --version | tee ../../reproduction/lean_target_standalone/version.log
          set -o pipefail
          lake env lean Audit.lean | tee ../../reproduction/lean_target_standalone/axioms.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lean-target-standalone
          path: reproduction/lean_target_standalone/
          retention-days: 30
