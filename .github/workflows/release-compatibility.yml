name: Release metadata compatibility
on:
  pull_request:
  push:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Release boundary and negative controls on actual head
        run: |
          python -m unittest discover -s .github/scripts -p test_release_compatibility.py -v
          python -O -m unittest discover -s .github/scripts -p test_release_compatibility.py -v
          python .github/scripts/release_compatibility.py --output reproduction/release-compatibility.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: release-metadata-compatibility
          path: reproduction/release-compatibility.json
          if-no-files-found: error
