# Live archival harness: historical seal verification runs on the exact PR27 tree.
# Current-head preservation and new code are checked by signed-source-bridge.yml.
name: Frozen v3 historical regression
on:
  pull_request:
  workflow_dispatch:
  push:
    branches: [research/frozen-v3-holdout-run27]
permissions:
  contents: read
jobs:
  registration:
    name: Archived PR27 registration (${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.12']
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v6
        with:
          ref: 4314dc9d6cae00e52b8262f3653d6f72d31d87e1
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Record exact revision and verify the unchanged baseline
        run: |
          mkdir -p reproduction/frozen-v3-registration
          git rev-parse HEAD > reproduction/frozen-v3-registration/revision.txt
          git rev-parse HEAD^{tree} > reproduction/frozen-v3-registration/tree.txt
          git archive HEAD | gzip -n > reproduction/frozen-v3-registration/source.tar.gz
          python --version > reproduction/frozen-v3-registration/python.txt
          python -m research.external.frozen_v3.verify > reproduction/frozen-v3-registration/preflight.json
      - name: Registration and corruption tests, normal and optimized
        run: |
          set -o pipefail
          python -m unittest research.external.frozen_v3.test_registration -v 2>&1 | tee reproduction/frozen-v3-registration/tests-normal.log
          python -O -m unittest research.external.frozen_v3.test_registration -v 2>&1 | tee reproduction/frozen-v3-registration/tests-optimized.log
      - name: Evaluation must remain closed without a registered corpus
        run: |
          set +e
          python -m research.external.frozen_v3.verify --require-corpus > reproduction/frozen-v3-registration/readiness.json
          code=$?
          set -e
          test "$code" -eq 2
      - name: Retained targeted regressions only, not the external holdout
        run: |
          set -o pipefail
          suites="research.inference.test_inference_v3 research.inference.test_inference_v2 research.inference.test_inference research.signed_predicates.test_signed_predicates research.wordexpr.test_predicates research.unified.test_unified"
          python -m unittest $suites -v 2>&1 | tee reproduction/frozen-v3-registration/regressions-normal.log
          python -O -m unittest $suites -v 2>&1 | tee reproduction/frozen-v3-registration/regressions-optimized.log
      - name: Existing constructed CLI example and independent replay
        run: |
          python -m research.unified.v3 prove research/inference/examples/SignedPower.java --target research/inference/examples/signed-power-target.json --proof reproduction/frozen-v3-registration/example-proof.json > reproduction/frozen-v3-registration/example-result.json
          python -O - <<'PY'
          import builtins, json
          from pathlib import Path
          original = builtins.__import__
          def guarded(name, *args, **kwargs):
              if 'producer' in name or name in {'subprocess', 'z3', 'cvc5', 'pysmt'}:
                  raise RuntimeError('unexpected replay dependency: ' + name)
              return original(name, *args, **kwargs)
          builtins.__import__ = guarded
          from research.unified.v3 import check
          source = Path('research/inference/examples/SignedPower.java').read_text()
          target = json.loads(Path('research/inference/examples/signed-power-target.json').read_text())
          proof = json.loads(Path('reproduction/frozen-v3-registration/example-proof.json').read_text())
          result = check(source, target, proof)
          if result['status'] != 'certified':
              raise RuntimeError('retained constructed example did not replay')
          print(json.dumps(result, sort_keys=True))
          PY
      - name: Check post-test identity and copy registration metadata
        run: |
          python -O -m research.external.frozen_v3.verify > reproduction/frozen-v3-registration/postflight.json
          cmp reproduction/frozen-v3-registration/preflight.json reproduction/frozen-v3-registration/postflight.json
          cp research/external/frozen_v3/ENGINE.json research/external/frozen_v3/REGISTRATION.json research/external/frozen_v3/PROTOCOL.md reproduction/frozen-v3-registration/
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: frozen-v3-registration-py${{ matrix.python-version }}
          path: reproduction/frozen-v3-registration/
          retention-days: 30
  acquisition:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10.21', '3.12.14']
    steps:
      - uses: actions/checkout@v6
        with:
          ref: 4314dc9d6cae00e52b8262f3653d6f72d31d87e1
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Acquire pinned frame and record environment, never evaluate
        if: ${{ hashFiles('research/external/frozen_v3/run27/CORPUS_LOCK.json') == '' }}
        run: |
          mkdir -p reproduction/run27-acquisition
          git rev-parse HEAD > reproduction/run27-acquisition/revision.txt
          git archive HEAD | gzip -n > reproduction/run27-acquisition/source.tar.gz
          python research/external/frozen_v3/run27/acquire.py reproduction/run27-acquisition/data
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: run27-acquisition-py${{ matrix.python-version }}
          path: reproduction/run27-acquisition/
          retention-days: 30
  run27:
    name: Archived PR27 metadata (${{ matrix.python-version }})
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        python-version: ['3.12.14', '3.10.21']
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: 4314dc9d6cae00e52b8262f3653d6f72d31d87e1
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: ${{ matrix.python-version }}
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '17.0.20+1'
      - name: Acquire exact registered bytes and export isolated baseline
        run: |
          mkdir -p reproduction/run27
          git rev-parse HEAD > reproduction/run27/revision.txt
          git rev-parse HEAD^{tree} > reproduction/run27/tree.txt
          git archive HEAD | gzip -n > reproduction/run27/source.tar.gz
          git archive c8c7b4eeaf848d31c8c324a4316ffec8aac81cda | gzip -n > reproduction/run27/baseline.tar.gz
          mkdir "$RUNNER_TEMP/qkf27-baseline"
          tar -xzf reproduction/run27/baseline.tar.gz -C "$RUNNER_TEMP/qkf27-baseline"
          python research/external/frozen_v3/run27/acquire.py reproduction/run27/input
      - name: Validate corpus and inventory; require exact runtime before authorized evaluation
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          if [ "$EVENT_NAME" = push ]; then
            python research/external/frozen_v3/run27/gate.py "$RUNNER_TEMP/qkf27-baseline" reproduction/run27/input > reproduction/run27/corpus-preflight.json
          else
            python - <<'PYMETA'
          import json, os, platform, sys
          from pathlib import Path
          sys.path.insert(0, 'research/external/frozen_v3/run27')
          import acquire, gate
          result = gate.preflight(os.environ['RUNNER_TEMP'] + '/qkf27-baseline',
                                  'reproduction/run27/input', require_runtime=False)
          Path('reproduction/run27/corpus-preflight.json').write_text(json.dumps(result, indent=2) + '\n')
          runtime = {'scope': 'archived metadata only; no external evaluation',
                     'actual': acquire.runtime(),
                     'registered': gate.load(gate.HERE / 'RUNTIMES.json').get(platform.python_version())}
          try:
              gate.runtime_check()
              runtime['strict_runtime_status'] = 'match'
          except ValueError as exc:
              runtime['strict_runtime_status'] = 'drift'
              runtime['reason'] = str(exc)
          Path('reproduction/run27/runtime-comparison.json').write_text(json.dumps(runtime, indent=2) + '\n')
          print(json.dumps({'scope': runtime['scope'], 'strict_runtime_status': runtime['strict_runtime_status']}))
          PYMETA
          fi
      - name: Test supervisor on constructed cases only
        run: |
          set -o pipefail
          python -m unittest research.external.frozen_v3.run27.test_run27 -v 2>&1 | tee reproduction/run27/tests-normal.log
          python -O -m unittest research.external.frozen_v3.run27.test_run27 -v 2>&1 | tee reproduction/run27/tests-optimized.log
      - name: Run frozen evaluation only on the published authorization commit
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          if [ "$EVENT_NAME" = push ] && git diff-tree --no-commit-id --name-only -r HEAD | grep -qx 'research/external/frozen_v3/run27/EXECUTION.json'; then
            python research/external/frozen_v3/run27/runner.py "$RUNNER_TEMP/qkf27-baseline" reproduction/run27/input reproduction/run27/evaluation
          else
            echo 'Metadata/constructed tests only; no external candidate was evaluated in this job.' | tee reproduction/run27/NOT_EVALUATED.txt
          fi
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: frozen-v3-run27-py${{ matrix.python-version }}
          path: reproduction/run27/
          retention-days: 30
