name: Exact masked successor
on:
  push:
    branches: [research/exact-masked-successor-v1]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  exact-successor:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Record exact revision and tree
        run: |
          mkdir -p reproduction/masked
          git rev-parse HEAD > reproduction/masked/revision.txt
          git rev-parse HEAD^{tree} > reproduction/masked/tree.txt
      - name: Install pinned Lean and check the existing project
        uses: leanprover/lean-action@50fcf42d2e460296f1a34b402e990d1b24f8b596
        with:
          lake-package-directory: research/lean_targets
          use-github-cache: false
      - name: Regenerate independently checked source and target packages
        run: python -m research.observations.run_target_experiment reproduction/masked/fresh
      - name: Bind fresh exports to the exact machine data used by the new theorem
        run: |
          python -O - <<'PY'
          import hashlib
          import json
          from pathlib import Path
          from research.observations.lean_target_export import CASES, ROOT, build_export, render_all, successor_goal
          from research.observations.run_io import read_json
          fresh = ROOT / 'reproduction/masked/fresh'
          exports = {}
          for name in CASES:
              source = (ROOT / 'research/observations/evidence/ascending' / (name + '.java')).read_bytes().decode('utf-8')
              package = read_json(fresh / ('ascending.' + name + '.cyclic_successor') / 'package.json', package=True)
              exports[name] = build_export(source, successor_goal(), package)
          rendered = render_all(exports).encode('utf-8')
          if rendered != (ROOT / 'research/lean_targets/QKFTarget/Exported.lean').read_bytes():
              raise SystemExit('fresh packages differ from the compiled data')
          out = ROOT / 'reproduction/masked/export'
          out.mkdir(parents=True, exist_ok=False)
          (out / 'Exported.lean').write_bytes(rendered)
          for name, data in exports.items():
              (out / (name + '.json')).write_text(json.dumps(data, indent=2, sort_keys=True) + '\n')
          print(json.dumps({'export_sha256': hashlib.sha256(rendered).hexdigest(), 'lean_checked': False}))
          PY
      - name: Fresh exact-word proof, strict audit and semantic controls
        run: python -O research/lean_targets/check_masked.py --output reproduction/masked/lean --timeout 300
      - name: Require all proof and rejection obligations
        run: |
          python - <<'PY'
          import hashlib
          import json
          from pathlib import Path
          result = json.loads(Path('reproduction/masked/lean/RESULT.json').read_text())
          if result['status'] != 'accepted' or result['lean_checked'] is not True:
              raise SystemExit('exact-word formal validation not accepted')
          if len(result['axioms']) != 16 or len(result['controls']) != 8:
              raise SystemExit('missing audited theorem or semantic control')
          if result.get('placeholder_rejected_by_audit') is not True:
              raise SystemExit('missing real placeholder axiom control')
          for name, digest in result['lean_source_sha256'].items():
              if hashlib.sha256((Path('research/lean_targets') / name).read_bytes()).hexdigest() != digest:
                  raise SystemExit('source changed after compilation: ' + name)
          print(json.dumps(result, sort_keys=True))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: exact-masked-successor
          path: reproduction/masked/
          retention-days: 30
